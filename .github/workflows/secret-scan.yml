name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history, all branches)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch all branches
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Install gitleaks 8.21.2
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan every commit for API keys and tokens
        run: ./gitleaks git --redact --no-banner --verbose --exit-code 1 --log-opts="--all" .
